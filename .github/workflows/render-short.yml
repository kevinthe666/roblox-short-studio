name: Render Roblox Short

on:
  workflow_dispatch:
  schedule:
    # 20:17 UTC = 01:47 India Standard Time (next day)
    - cron: "17 20 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install free narration tool
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Install free rendering dependencies
        run: python -m pip install -r requirements.txt
      - name: Render one-minute story
        run: python scripts/render_short.py
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output/episode_01.mp4
          if-no-files-found: error
          retention-days: 7
